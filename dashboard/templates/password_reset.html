
{% extends 'base.html' %}

{% block title %}Reset Password | Brightloop{% endblock %}

{% block auth_content %}

<div class="auth-wrapper">
    <div class="auth-card">

        <h2>Forgot Password?</h2>
        <p class="text-muted">
            Enter your registered email address to receive a reset link.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                {{ form.email }}
                {{ form.email.errors }}
            </div>

            <button class="btn btn-success w-100">
                Send Reset Link
            </button>
        </form>

        <div class="auth-links">
            <a href="{% url 'login' %}">Back to Login</a>
        </div>

    </div>
</div>

{% endblock %}
