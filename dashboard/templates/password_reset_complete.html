
{% extends 'base.html' %}

{% block title %}Password Changed | Brightloop{% endblock %}

{% block auth_content %}

<div class="auth-wrapper">
    <div class="auth-card text-center">

        <i class="bi bi-check-circle-fill display-3 text-success"></i>

        <h2 class="mt-3">Password Changed!</h2>

        <p class="text-muted">
            Your password has been successfully updated.
        </p>

        <a href="{% url 'login' %}" class="btn btn-success w-100">
            Login Now
        </a>

    </div>
</div>

{% endblock %}
