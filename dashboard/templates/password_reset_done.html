
{% extends 'base.html' %}

{% block title %}Email Sent | Brightloop{% endblock %}

{% block auth_content %}

<div class="auth-wrapper">
    <div class="auth-card text-center">

        <i class="bi bi-envelope-check display-3 text-success"></i>

        <h2 class="mt-3">Check Your Email</h2>

        <p class="text-muted">
            If an account exists with that email address,
            password reset instructions have been sent.
        </p>

        <a href="{% url 'login' %}" class="btn btn-success w-100">
            Back to Login
        </a>

    </div>
</div>

{% endblock %}
